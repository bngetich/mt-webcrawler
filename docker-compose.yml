services:
  prometheus:
    image: prom/prometheus
    container_name: crawler-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./demo/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    container_name: crawler-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - ./demo/grafana/provisioning:/etc/grafana/provisioning
